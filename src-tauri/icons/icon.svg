  <g transform="translate(88.1 89.2) scale(1.12)">
    <rect x="296" y="65" width="165" height="625" rx="26" fill="#ffffff"/>
    <g fill="#1c1f26">
      <circle cx="378.5" cy="192" r="74"/>
      <circle cx="344" cy="300" r="29"/>
      <circle cx="410" cy="300" r="29"/>
      <circle cx="344" cy="368" r="29"/>
      <circle cx="344" cy="436" r="29"/>
      <rect x="381" y="339" width="58" height="126" rx="29"/>
    </g>
  </g>
