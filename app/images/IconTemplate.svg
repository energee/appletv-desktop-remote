      </mask>
    </defs>
    <rect x="-6" y="-15" width="18" height="38" rx="4" fill="#000" mask="url(#side)"/>
    <path fill="#000" fill-rule="evenodd" d="
      M-5 -19 H5 A4 4 0 0 1 9 -15 V15 A4 4 0 0 1 5 19 H-5 A4 4 0 0 1 -9 15 V-15 A4 4 0 0 1 -5 -19 Z
      M0 -15 a7 7 0 1 0 0.001 0 Z
