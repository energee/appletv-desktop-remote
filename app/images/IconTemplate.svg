<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Menu bar icon source for IconTemplate.png (36 px, drawn at 2x for an 18 pt menu bar);
       after editing, run scripts/build-icons.sh.
       A macOS template image: only the alpha channel matters, and the menu bar tints it.
       Upper end of the app icon's remote, viewed from above and the right.
       Transparent clickpad/buttons and an inset seam preserve depth at menu bar size. -->
