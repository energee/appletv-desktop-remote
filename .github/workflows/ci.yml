# Checks every pull request and push to main: TypeScript types, lint, formatting, vitest, and
# the Rust host's tests and clippy. Releases are built by build.yml on version tags.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # macOS: the host links the Objective-C wake observer and needs no extra system packages.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # pnpm first: setup-node caches the packageManager's store, so pnpm must already exist.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # tauri.conf.json points at the built webview and sidecar, which the Rust build requires.
      - run: pnpm build:renderer && pnpm build:sidecar
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
