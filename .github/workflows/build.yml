name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build every platform without publishing, to test workflow changes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # tauri-action reads, merges, and replaces latest.json. Serialize release jobs
      # so each platform preserves metadata uploaded by the preceding platform.
      max-parallel: 1
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-x64
            args: --target x86_64-apple-darwin
          - os: macos-latest
            platform: macos-arm64
            args: --target aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x64
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      # Only tag pushes sign. workflow_dispatch remains an unsigned, build-only path,
      # including when manually run against a tag.
      TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # pnpm first: setup-node caches the packageManager's store, so pnpm must already exist.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install sidecar dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Verify tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || {
            echo '::error::Tagged releases require the TAURI_SIGNING_PRIVATE_KEY repository secret.'
            exit 1
          }
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const tagVersion = process.env.GITHUB_REF_NAME.slice(1);
          const versions = [
            JSON.parse(readFileSync('package.json')).version,
            JSON.parse(readFileSync('src-tauri/tauri.conf.json')).version,
            readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"$/m)?.[1],
          ];
          if (versions.some((version) => version !== tagVersion)) {
            throw new Error(`Tag ${tagVersion} does not match project versions: ${versions.join(', ')}`);
          }
          EOF
      # Subsequent serialized jobs reuse GitHub's generated notes in latest.json.
      - name: Read generated release notes
        id: release-notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/release-notes.md" 2>/dev/null; then
            delimiter=$(node -p 'crypto.randomUUID()')
            printf 'body<<%s\n' "$delimiter" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$delimiter" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
          releaseBody: ${{ steps.release-notes.outputs.body }}
          args: >-
            ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          releaseAssetNamePattern: '[name]_[version]_[arch][setup][ext]'
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: true
      - name: Build unsigned workflow artifacts
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[] | .apiUrl, .url]' > "$RUNNER_TEMP/release-assets.json"
          jq -e --arg version "$version" --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
            . as $manifest
            | (
              $manifest.version == $version
              and ($manifest.notes | type == "string")
              and ($manifest.platforms | type == "object")
              and (
                ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"]
                | all(
                    .[];
                    . as $platform
                    | ($manifest.platforms[$platform] | type == "object")
                    and ($manifest.platforms[$platform].url as $url | $assets[0] | index($url) != null)
                    and ($manifest.platforms[$platform].signature | type == "string" and length > 0)
                  )
              )
            )
          ' "$RUNNER_TEMP/latest.json"
          gh release edit "$GITHUB_REF_NAME" --draft=false
